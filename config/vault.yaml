# Second Brain — core vault & agent settings.

# ── Vault identity ───────────────────────────────────────────────────────────
# A vault is a single PURPOSE-bound knowledge base. To switch which vault is
# active, change vault_path (and vault_name) — this file is the single source of
# truth for the active vault's location.
vault_name: Inference-Disagg
vault_path: /mnt/c/Obsidian/Inference-Disagg
code_path: /home/jpietrak/second_brain

# PURPOSE — the research subject that binds every wiki page and source in this
# vault. Agents MUST load it as a high-priority relevance filter for all automated
# actions (ingest, research, source discovery): prioritise on-purpose material,
# down-rank or flag off-purpose material, and frame every extraction around it.
# The authoritative, full statement lives in the vault's `_CLAUDE.md` under
# "## Vault purpose"; keep this one-liner in sync with that heading.
purpose: >
  TBD — pending user confirmation. Folder name implies: disaggregated LLM
  inference (prefill/decode separation, KV-cache transfer, serving systems).

methodology: PARA            # PARA | Zettelkasten | LYT | Generic

# Obsidian Local REST API (coddingtonbear plugin in Windows Obsidian).
# HTTPS/27124 is the plugin default (self-signed cert). Switch to
# http://127.0.0.1:27123 only if you enable non-encrypted mode.
obsidian_api_url: https://127.0.0.1:27124

agent_max_turns: 30         # per ingest session
hot_cache_words: 500        # target size of wiki/hot.md
nightly_run_hour: 2         # local time for Tier-2 local nightly run
