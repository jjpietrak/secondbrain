# Second Brain — cost budget. Guards the pay-as-you-go pool (LiteLLM -> Anthropic/Gemini).
# Tier-1 Routines and Tier-2 `claude -p` draw Agent SDK credit (cost ~0) and are tracked
# as tokens, not dollars. Mirror `daily_usd_cap` into config/litellm.yaml (max_budget).

daily_usd_cap: 2.0          # USD/day across all metered routes
on_cap: stop                # stop | warn  (nightly orchestrator behaviour at cap)

providers:
  anthropic:
    metered: true
  gemini:
    metered: true           # free tier in practice; tracked for visibility
  ollama:
    metered: false          # free / local

# Optional per-action soft limits on output tokens (advisory; logged, not hard-enforced).
per_action_token_soft_limit:
  obsidian-research-deep: 200000
  obsidian-ingest: 150000
