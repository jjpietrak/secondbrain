# Second Brain — core vault & agent settings.

# ── Vault identity ───────────────────────────────────────────────────────────
# A vault is a single PURPOSE-bound knowledge base. To switch which vault is
# active, change vault_path (and vault_name) — this file is the single source of
# truth for the active vault's location.
vault_name: Inference-Disagg
vault_path: /mnt/c/Obsidian/Inference-Disagg
code_path: /home/jpietrak/second_brain

# PURPOSE — the research subject that binds every wiki page and source in this
# vault. Agents MUST load it as a high-priority relevance filter for all automated
# actions (ingest, research, source discovery): prioritise on-purpose material,
# down-rank or flag off-purpose material, and frame every extraction around it.
# The authoritative, full statement lives in the vault's `_CLAUDE.md` under
# "## Vault purpose"; keep this one-liner in sync with that heading.
purpose: >
  Stay current on disaggregated LLM inference — prefill/decode separation and finer
  FFN/attention-layer disaggregation across distinct resource pools, KV-cache transfer,
  and the serving systems, scheduling, and (heterogeneous-cluster) hardware that enable
  it — in service of designing a disaggregated-inference simulator and architecture for
  the "Iris Tetra" optical accelerator (power-efficient, high-throughput, strong at
  long-context prefill, unlike decode-oriented chips such as Groq or Cerebras).

methodology: PARA            # PARA | Zettelkasten | LYT | Generic

# Default research engine for /obsidian-research[-deep]. Override per call with a flag
# (--claude | --perplexity | --free).
#   claude     — Claude's native WebSearch + WebFetch (+ deep-research skill). $0 on the
#                subscription / Agent SDK credit pool. No API key needed. (recommended)
#   perplexity — Perplexity Sonar / sonar-deep-research. Metered (needs PERPLEXITY_API_KEY).
#   free       — key-less sources only (arXiv, HN, Reddit, Wikipedia…). $0 but shallow.
research_engine: claude

# Obsidian Local REST API (coddingtonbear plugin in Windows Obsidian).
# HTTPS/27124 is the plugin default (self-signed cert). Switch to
# http://127.0.0.1:27123 only if you enable non-encrypted mode.
obsidian_api_url: https://127.0.0.1:27124

agent_max_turns: 30         # per ingest session
hot_cache_words: 500        # target size of wiki/hot.md
nightly_run_hour: 2         # local time for Tier-2 local nightly run

# NotebookLM sync (per-vault). The notebook id (or `nlm` alias) this vault syncs with
# via /obsidian-notebooklm-sync and the nightly step. $0 (Google cookies, no API pool).
# Leave blank to disable. A global NLM_SYNC_NOTEBOOK env var overrides this only when
# this field is empty (back-compat). See [[notebooklm-integration]].
notebooklm_notebook: e490aeb9-7257-4308-9007-3be03c544338
