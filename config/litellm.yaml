# ============================================================================
# Second Brain — LiteLLM routing.  *** SINGLE SWITCH FILE for task -> model. ***
#
# To change which model handles a task, edit ONLY that role's `model:` line below.
# Everything else (skills, CLAUDE.md) refers to ROLE NAMES (synthesis/bulk/
# validation/fallback), never concrete model ids.
#
# NOTE: the main INTERACTIVE Claude Code agent's model is NOT set here — it is
# pinned in .claude/settings.json ("model") or overridden with `claude --model`.
# Only ANTHROPIC_API_KEY (pay-as-you-go) is used here; the OAuth/credit pool is
# never touched by LiteLLM.
# ============================================================================

model_list:
  # synthesis: programmatic Anthropic fallback. HAIKU on purpose (cheap) — heavy
  # synthesis runs on the subscription via interactive/Tier-2 claude, not this route.
  - model_name: synthesis
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # bulk: >10pg summarisation / embeddings. Free + local. Swap to ollama/mistral when pulled.
  - model_name: bulk
    litellm_params:
      model: ollama/llama3:8b
      api_base: http://localhost:11434

  # validation: cross-check / grounding. Gemini Flash free tier.
  - model_name: validation
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # fallback: local model used when a paid route fails or its budget is exhausted.
  - model_name: fallback
    litellm_params:
      model: ollama/llama3:8b
      api_base: http://localhost:11434

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - synthesis: ["fallback"]
    - validation: ["fallback"]
    - bulk: ["fallback"]

litellm_settings:
  drop_params: true
  max_budget: 2.0          # USD/day across all metered routes (shared proxy = all vaults). Per-vault soft caps live in config/vaults/<vault>/budget.yaml
  budget_duration: 1d
  callbacks: cost_callback.proxy_handler_instance   # resolves to config/cost_callback.py

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
